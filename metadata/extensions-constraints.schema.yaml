type: seq
sequence:
  - type: map
    mapping:
      "relation":
        type: str
        required: true
      "relation_id":
        type: str
        required: false
        pattern: /^(RO|BFO|GOREL):[0-9]{7}$/
      "namespaces":
        type: seq
        required: true
        sequence:
          - type: str
            required: true
            pattern: /[0-9a-zA-Z\_]+(\:[0-9]{7})?/
      "primary_root_terms":
        type: seq
        required: true
        sequence:
          - type: str
            required: true
            pattern: /[0-9a-zA-Z\_]+\:[0-9]{7}?/
      "cardinality":
        type: number
        required: false
