# Annotation extension constraints
#
# Each entry is a set of conditions that an extension unit in an annotation
# can satisfy: the GO term being annotated, the relation, the namespace of
# the filler, and optionally how many such units may appear together. An
# extension unit is valid if it satisfies all the conditions of at least
# one entry.
#
# This file is the basis for GORULE:0000058.
#
# Fields:
#
#   relation           Extension relation as a GAF-style label (spaces
#                      replaced with underscores), e.g. occurs_in. Used by
#                      consumers that identify relations by label, such as
#                      ontobio.
#
#   relation_id        Optional. CURIE of the same relation (RO, BFO, or
#                      GOREL), e.g. BFO:0000066 for occurs_in. Used by
#                      consumers that identify relations by ID, such as the
#                      Standard Annotation Backend. It always denotes the
#                      same relation as `relation`; it is not an
#                      additional condition.
#
#                      An entry has no relation_id when its relation has no
#                      current, non-obsolete RO/BFO/GOREL term with a clear
#                      one-to-one correspondence. Specifically:
#                        - the relation is obsolete in RO/GOREL with no
#                          replacement: has_regulation_target,
#                          in_presence_of, not_occurs_in, occurs_at,
#                          regulates_transcription_of,
#                          regulates_o_acts_on_population_of
#                        - the relation is obsolete and its replacement
#                          does not have the same meaning: has_agent
#                          (RO:0002218, replaced by RO:0002500 "causal
#                          agent in process", which has the inverse
#                          direction), regulates_activity_of (GOREL:0098702;
#                          RO:0011002 relates two material entities, not a
#                          GO term to a gene product)
#                      Consumers matching by ID should skip entries without
#                      relation_id.
#
#   namespaces         Allowed ID prefixes for the extension filler (the ID
#                      inside the parentheses), e.g. UniProtKB, CL, GO.
#
#   primary_root_terms GO terms the annotated term must be equal to or a
#                      subclass (is_a) descendant of.
#
#   cardinality        Optional. Maximum number of times an extension with
#                      this relation and filler namespace may occur within
#                      a single conjunction (comma-separated group). No
#                      limit if absent.
#
